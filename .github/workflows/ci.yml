name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@bfe8cc55a7890e3d6672eda6460ef37bfcc70755
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tool identities
        run: |
          python --version
          git --version

      - name: Compile
        run: python -m compileall src tools

      - name: Test
        run: python -m pytest -q

      - name: Ruff lint
        run: python -m ruff check src tests tools

      - name: Ruff format
        run: python -m ruff format --check src tests tools

      - name: Mypy
        run: python -m mypy src

      - name: Generate misleading-log evidence bundle
        run: debug-evidence fixtures/misleading-log.json --out artifacts/misleading-log.json

      - name: Generate missing-evidence control
        run: debug-evidence fixtures/missing-evidence.json --out artifacts/missing-evidence.json

      - name: Generate unsafe-probe control
        run: debug-evidence fixtures/unsafe-probe.json --out artifacts/unsafe-probe.json

      - name: Prove bounded V0 outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          main = json.loads(Path("artifacts/misleading-log.json").read_text())
          statuses = {item["hypothesis_id"]: item["status"] for item in main["hypotheses"]}
          assert statuses["database-misconfiguration"] == "CONTRADICTED"
          assert statuses["cache-thrash"] == "SUPPORTED"
          assert main["redacted_environment"]["API_TOKEN"] == "[REDACTED]"

          missing = json.loads(Path("artifacts/missing-evidence.json").read_text())
          assert missing["hypotheses"][0]["status"] == "INDETERMINATE"

          unsafe = json.loads(Path("artifacts/unsafe-probe.json").read_text())
          assert unsafe["hypotheses"][0]["status"] == "INDETERMINATE"
          assert unsafe["probes"][0]["blocked"] is True
          PY

      - name: Prove local Python runtime evidence and reproducible archive V0.2
        env:
          APP_MODE: production
          WORKSPACE_HINT: /tmp/debug-evidence-local
          DEBUG_EVIDENCE_TEST_TOKEN: synthetic-redaction-value-123
        run: |
          rm -rf /tmp/debug-evidence-local
          python tools/create_local_fixture.py /tmp/debug-evidence-local
          before="$(git -C /tmp/debug-evidence-local status --porcelain=v1 --untracked-files=all)"
          debug-evidence-local fixtures/local-v02-python.json \
            --workspace /tmp/debug-evidence-local \
            --report artifacts/local-v02-report.json \
            --archive artifacts/local-v02-incident.zip \
            --archive-receipt artifacts/local-v02-archive-receipt.json
          after="$(git -C /tmp/debug-evidence-local status --porcelain=v1 --untracked-files=all)"
          test "$before" = "$after"
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          secret = "synthetic-redaction-value-123"
          report_path = Path("artifacts/local-v02-report.json")
          report_text = report_path.read_text()
          report = json.loads(report_text)
          archive_path = Path("artifacts/local-v02-incident.zip")
          receipt = json.loads(Path("artifacts/local-v02-archive-receipt.json").read_text())

          assert report["schema"] == "debug-evidence.local-report.v0.2"
          assert report["trace"]["error_type"] == "CacheOverflow"
          assert report["git"]["changed_paths"] == ["src/service.py"]
          assert report["environment"] == [
              ["APP_MODE", "production"],
              ["DEBUG_EVIDENCE_TEST_TOKEN", "[REDACTED]"],
              ["WORKSPACE_HINT", "<WORKSPACE>"],
          ]
          statuses = {item["hypothesis_id"]: item["status"] for item in report["bundle"]["hypotheses"]}
          assert statuses["database-outage"] == "CONTRADICTED"
          assert statuses["cache-regression"] == "SUPPORTED"
          assert secret not in report_text
          assert secret.encode() not in archive_path.read_bytes()
          assert receipt["archive_sha256"]
          assert receipt["members"]

          with zipfile.ZipFile(archive_path) as archive:
              for name in archive.namelist():
                  assert secret.encode() not in archive.read(name)
          PY

      - name: Prove local path escape fails closed before archive creation
        run: |
          printf 'outside\n' > /tmp/outside.log
          rm -f artifacts/local-v02-escape.zip artifacts/local-v02-escape-receipt.json
          set +e
          debug-evidence-local fixtures/local-v02-path-escape.json \
            --workspace /tmp/debug-evidence-local \
            --report artifacts/local-v02-path-escape.json \
            --archive artifacts/local-v02-escape.zip \
            --archive-receipt artifacts/local-v02-escape-receipt.json
          status=$?
          set -e
          test "$status" -eq 3
          test "$(cat /tmp/outside.log)" = "outside"
          test ! -e artifacts/local-v02-escape.zip
          test ! -e artifacts/local-v02-escape-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("artifacts/local-v02-path-escape.json").read_text())
          assert payload["outcome"] == "INDETERMINATE"
          assert payload["error_code"] == "UNSAFE_PATH"
          PY

      - name: Upload incident evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-evidence-v02
          path: artifacts/
          if-no-files-found: error
