[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "debug-evidence"
version = "0.2.0"
description = "Evidence-driven bounded incident diagnosis CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Eduardo Henrique Ananias"}]
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.3", "ruff>=0.8"]

[project.scripts]
debug-evidence = "debug_evidence.cli:main"
debug-evidence-local = "debug_evidence.local_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["debug_evidence"]
